[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depth-estimation-dev"
version = "0.1.0"
description = "Fish 3D position estimation using YOLOv8 detection + FoundationStereo depth + multi-object tracking"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # --- Core inference ---
    "torch>=2.0.0",
    "torchvision",
    "numpy",
    "scipy",
    # --- YOLOv8 detection ---
    "ultralytics>=8.0.0",
    # --- FoundationStereo / image processing ---
    "opencv-contrib-python>=4.8,<5",
    "pyyaml",
    "omegaconf",
    "scikit-image",
    "timm",
    "einops",
    "imageio",
    "open3d",
    "trimesh",
    "imgaug",
    "ninja",
    "albumentations",
    "scikit-learn",
    "joblib",
    "xformers",
    "huggingface-hub",
    "socksio>=1.0.0",
    # --- gRPC server (Unity camera streaming) ---
    "grpcio",
    "protobuf",
    "seaborn>=0.13.2",
    "gitpython>=3.1.53",
]

[project.scripts]
depth-demo-video = "depth_estimation.demo_video:main"

[tool.hatch.build.targets.wheel]
packages = ["src/depth_estimation"]
