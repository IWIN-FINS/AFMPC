[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depth-estimation-dev"
version = "0.1.0"
description = "Real-device stereo fish detection, depth estimation, and tracking for FinsROV"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "numpy",
    "scipy",
    "ultralytics>=8.0.0",
    "opencv-contrib-python>=4.8,<5",
    "pyyaml",
    "omegaconf",
    "scikit-image",
    "timm",
    "einops",
    "imageio",
    "open3d",
    "xformers",
]

[project.scripts]
depth-demo-video = "depth_estimation.demo_video:main"
stereo-capture-calibration = "depth_estimation.calibration_tools.capture_stereo_chessboard_images:main"
stereo-calibrate = "depth_estimation.calibration_tools.calibrate_stereo_chessboard:main"
stereo-preview-udp = "depth_estimation.calibration_tools.preview_stereo_udp:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:ament_xmllint",
    "-p", "no:ament_lint",
    "-p", "no:ament_copyright",
    "-p", "no:launch_ros",
    "-p", "no:ament_pep257",
    "-p", "no:ament_flake8",
    "-p", "no:launch_testing",
]

[tool.hatch.build.targets.wheel]
packages = ["src/depth_estimation"]
