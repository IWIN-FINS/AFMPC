[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsrov-control"
version = "0.1.0"
description = "Real-vehicle MPC, PID, and SMC control stack for FinsROV"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.24",
    "osqp>=1.0",
    "pyserial>=3.5",
    "scipy>=1.10",
]

[project.scripts]
finsrov-auto-preflight = "MPC_dual_model.auto_readiness:main"
finsrov-auto = "MPC_dual_model.auto_only_runtime:main"
finsrov-experimental-auto = "MPC_dual_model.experimental_auto:main"
finsrov-smc = "apps.finesub_smc_control:main"
finsrov-hardware-diagnostic = "PID_controller.hardware_diagnostic:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "MPC_dual_model",
    "MPC_dual_model_yaw",
    "MPC_model1",
    "MPC_model2",
    "PID_controller",
    "apps",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "MPC_dual_model/tests",
    "MPC_dual_model_yaw/tests",
    "MPC_model1/tests",
    "MPC_model2/tests",
    "PID_controller/tests",
]
addopts = [
    "-p", "no:ament_xmllint",
    "-p", "no:ament_lint",
    "-p", "no:ament_copyright",
    "-p", "no:launch_ros",
    "-p", "no:ament_pep257",
    "-p", "no:ament_flake8",
    "-p", "no:launch_testing",
]

